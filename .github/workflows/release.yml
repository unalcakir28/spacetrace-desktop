name: Release

# The bundles are built here and published **into the public repo**
# (unalcakir28/spacetrace), because a private repository's release assets need
# a credential to download and a download page must not ask for one. Source
# stays private; the installers are public. See RELEASING.md.
#
#   push to main   -> tag `desktop-continuous`, replaced in place
#   push of a v*   -> tag `desktop-v…`, permanent
#
# Nothing is code-signed. macOS and Windows will both warn on first launch and
# the download page says so and how to get past it; signing needs certificates
# that cost money and cannot live in a repo.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # CHANGELOG.md is named out of this list on purpose: it is not
    # documentation but the release notes themselves, and it is compiled into
    # the binary. A push that only touches it must still rebuild, or the
    # continuous release keeps describing the version before it.
    paths-ignore:
      - "README.md"
      - "RELEASING.md"
      - "tasks/**"
      - "design-preview.html"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build as, e.g. v0.1.0-test"
        required: true
      publish:
        description: >-
          Publish the result. Off by default, so a dispatch is a dry run.
          Turn it on to release a tag by hand — which is the way out if the
          paths-ignore filter above skipped a tag push.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Where the downloads live. One public place for all three components.
  DOWNLOAD_REPO: unalcakir28/spacetrace

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      rolling: ${{ steps.pick.outputs.rolling }}
      channel: ${{ steps.pick.outputs.channel }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: pick
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tagged=false
          if [ -n "${INPUT_TAG:-}" ]; then
            version="$INPUT_TAG"; rolling=false
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"; rolling=false; tagged=true
          else
            version=continuous; rolling=true
          fi

          if [ "$rolling" = true ]; then channel=continuous; else channel=release; fi

          # This app carries its version in three files and RELEASING.md asks
          # for all three to be edited by hand. Nothing checked that they
          # agreed, so a half-done bump shipped an installer named v0.2.0
          # around a binary whose About panel said 0.1.0.
          pkg=$(jq -r .version package.json)
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          crate=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed 's/^version = "\(.*\)"/\1/')
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$crate" ]; then
            echo "::error::versions disagree — package.json $pkg, tauri.conf.json $conf, Cargo.toml $crate"
            exit 1
          fi

          # Real tag pushes only: a dispatch often names v0.1.0-test on
          # purpose, which is supposed to disagree.
          if [ "$tagged" = true ] && [ "$version" != "v$pkg" ]; then
            echo "::error::tag $version does not match version $pkg"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rolling=$rolling" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-$version" >> "$GITHUB_OUTPUT"
          echo "Building as desktop-$version" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.label }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal .dmg rather than two: the download page then has a
          # single macOS button, and "which Mac do I have" stops being the
          # user's problem.
          - label: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
          # 24.04 for the glibc floor; deb, rpm and AppImage all come off this
          # one build.
          - label: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v5

      - name: System prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev build-essential file rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - run: yarn install --frozen-lockfile

      - name: Build bundles
        # Stamped in so the About panel can say which build this is rather than
        # only which version — every continuous build shares one number, and
        # that line is what identifies a build in a bug report.
        env:
          SPACETRACE_GIT_SHA: ${{ github.sha }}
          SPACETRACE_CHANNEL: ${{ needs.meta.outputs.channel }}
          # Signs the updater packages. This is Tauri's own minisign key, not
          # an Apple or Microsoft certificate: it proves an update came from
          # this pipeline, and says nothing about whether the OS trusts the
          # app. Without the secret the build still succeeds and simply
          # produces no `.sig`, which the publish step then notices.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: bash
        run: |
          export SPACETRACE_BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          # The lockfile is verified separately rather than with `--locked` on
          # the build. yarn 1 drops every argument before a `--`, so
          # `yarn tauri build --target X -- --locked` reaches the CLI as
          # `tauri build --locked` with the target gone — seen failing in CI.
          #
          # `cargo fetch --locked` fails if Cargo.lock disagrees with the
          # manifests, and once it agrees a normal build cannot change it. Same
          # guarantee, no argument smuggling: the core crates are git
          # dependencies with no rev, so without this two builds of one tag can
          # ship different scanner code and the stamped commit becomes a
          # half-truth.
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          yarn tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          LABEL: ${{ matrix.label }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          shopt -s nullglob
          # NOT dist/: that is Vite's output directory (`frontendDist` is
          # ../dist), so staging here would upload index.html and assets/
          # alongside the installers.
          mkdir -p bundles
          found=0
          for f in src-tauri/target/"$TARGET"/release/bundle/*/*.dmg \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.exe \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.deb \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.rpm \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.AppImage; do
            ext="${f##*.}"
            # A stable name is the point: the download page links one URL per
            # platform and it must not move when the version does.
            if [ "$ext" = "exe" ]; then suffix="-setup"; else suffix=""; fi
            cp "$f" "bundles/spacetrace-desktop-${VERSION}-${LABEL}${suffix}.${ext}"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "no bundles were produced" >&2; exit 1; }

          # The updater's own packages, kept separate from the five names the
          # download page binds to. Adding files is safe; renaming those five
          # is not, and the consumer is in another repo.
          #
          # macOS updates from the `.app.tar.gz`, Windows from the NSIS
          # installer and Linux from the AppImage — each with the `.sig` beside
          # it. deb and rpm have no updater path on purpose: those belong to a
          # package manager, and an app that fights dpkg is a worse citizen
          # than one that leaves it alone.
          for f in src-tauri/target/"$TARGET"/release/bundle/*/*.app.tar.gz \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.app.tar.gz.sig \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.exe.sig \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.AppImage.sig; do
            base="${f##*/}"
            case "$base" in
              *.app.tar.gz)     out="spacetrace-desktop-${VERSION}-${LABEL}.app.tar.gz" ;;
              *.app.tar.gz.sig) out="spacetrace-desktop-${VERSION}-${LABEL}.app.tar.gz.sig" ;;
              *.exe.sig)        out="spacetrace-desktop-${VERSION}-${LABEL}-setup.exe.sig" ;;
              *.AppImage.sig)   out="spacetrace-desktop-${VERSION}-${LABEL}.AppImage.sig" ;;
            esac
            cp "$f" "bundles/${out}"
          done
          ls -la bundles

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: bundles/*
          if-no-files-found: error

  publish:
    name: publish ${{ needs.meta.outputs.tag }}
    needs: [meta, build]
    # A dispatch is a dry run unless it was asked to publish.
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        # Regular files only, and never the sums file itself: `sha256sum ./*`
        # dies on the first directory it meets, which is how a stray folder in
        # an artifact takes the whole release down.
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + \
            | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Where do these go
        id: dest
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "${RELEASE_TOKEN:-}" ]; then
            echo "repo=$DOWNLOAD_REPO" >> "$GITHUB_OUTPUT"
          else
            echo "repo=$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
            echo "::warning title=Downloads are not public::RELEASE_TOKEN is unset, so the bundles were published into this private repository. Their URLs need a credential to fetch, which the download page cannot supply. RELEASING.md has the one command that fixes it."
          fi

      - name: Publish
        env:
          # The fine-grained token when it exists, so the release lands in the
          # public repo; the built-in one otherwise, which can only write here.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.dest.outputs.repo }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          ROLLING: ${{ needs.meta.outputs.rolling }}
        run: |
          # The changes come out of CHANGELOG.md rather than from the
          # generator in the core repo, which is not a command here. That is
          # also the correct source: CHANGELOG.md is produced from the *pinned*
          # version of that crate and a test asserts it is current, so slicing
          # it guarantees these notes match the changelog compiled into the app
          # being published.
          if [ "$ROLLING" = "true" ]; then
            section="Unreleased"
          else
            section="${VERSION#v} — "
          fi
          awk -v want="$section" '
            index($0, "## " want) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > changes.md

          # A release with no notes is worse than no release: the reader cannot
          # tell whether the notes are missing or the version was empty.
          if [ "$ROLLING" != "true" ] && [ ! -s changes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi

          cat > notes.md <<EOF
          spacetrace desktop, built from \`$GITHUB_REPOSITORY\` at \`${GITHUB_SHA:0:7}\` on $(date -u '+%Y-%m-%d %H:%M UTC').

          | Platform | File |
          |---|---|
          | macOS 11+ (Intel and Apple silicon) | \`.dmg\` |
          | Windows 10/11 | \`-setup.exe\` |
          | Debian / Ubuntu | \`.deb\` |
          | Fedora / RHEL | \`.rpm\` |
          | Any Linux | \`.AppImage\` |

          **Not code-signed.** macOS: right-click the app and choose *Open*, or
          run \`xattr -dr com.apple.quarantine /Applications/spacetrace.app\`.
          Windows: *More info* then *Run anyway* on the SmartScreen prompt.

          Install notes and usage: https://spacetrace.teknobakkall.com/download/
          EOF

          if [ -s changes.md ]; then
            printf '\n## What changed\n' >> notes.md
            cat changes.md >> notes.md
          fi

          if [ "$ROLLING" = "true" ]; then
            # Deleted and recreated so a bundle dropped from the matrix cannot
            # linger on the download page as a stale link.
            gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes || true
            gh release create "$TAG" artifacts/* \
              --repo "$REPO" \
              --prerelease \
              --title "Desktop — continuous build (main)" \
              --notes-file notes.md
          else
            gh release create "$TAG" artifacts/* \
              --repo "$REPO" \
              --title "spacetrace desktop $VERSION" \
              --notes-file notes.md
          fi

      # ------------------------------------------------------------ updater
      #
      # The app polls one fixed URL, so the manifest needs a tag that never
      # moves while its contents do. `desktop-latest` holds exactly this one
      # file and is recreated on every stable release; the five installer names
      # the download page binds to are untouched.
      #
      # Stable only. Pointing the updater at `desktop-continuous` would offer
      # every push to everyone who installed a release.
      - name: Publish the update manifest
        if: needs.meta.outputs.rolling == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.dest.outputs.repo }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          cd artifacts
          base="https://github.com/${REPO}/releases/download/${TAG}"

          # Every platform needs its signature file. Missing ones mean the
          # signing secret is not set, and a manifest that names an unsigned
          # package is a manifest the app will refuse — better to say so and
          # leave the previous manifest in place than to publish a broken one.
          mac="spacetrace-desktop-${VERSION}-macos-universal.app.tar.gz"
          win="spacetrace-desktop-${VERSION}-windows-x86_64-setup.exe"
          lin="spacetrace-desktop-${VERSION}-linux-x86_64.AppImage"
          missing=0
          for f in "$mac.sig" "$win.sig" "$lin.sig"; do
            [ -f "$f" ] || { echo "::warning::no $f — updater manifest skipped"; missing=1; }
          done
          if [ "$missing" = 1 ]; then
            echo "Set the TAURI_SIGNING_PRIVATE_KEY secret to enable self-update." >&2
            exit 0
          fi

          # macOS ships one universal bundle, so both architectures point at it.
          jq -n \
            --arg version "${VERSION#v}" \
            --arg pub_date "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --arg mac_url "$base/$mac" --arg mac_sig "$(cat "$mac.sig")" \
            --arg win_url "$base/$win" --arg win_sig "$(cat "$win.sig")" \
            --arg lin_url "$base/$lin" --arg lin_sig "$(cat "$lin.sig")" \
            '{
               version: $version,
               pub_date: $pub_date,
               notes: "",
               platforms: {
                 "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                 "darwin-x86_64":  { signature: $mac_sig, url: $mac_url },
                 "windows-x86_64": { signature: $win_sig, url: $win_url },
                 "linux-x86_64":   { signature: $lin_sig, url: $lin_url }
               }
             }' > latest.json
          cat latest.json

          gh release delete desktop-latest --repo "$REPO" --cleanup-tag --yes || true
          gh release create desktop-latest latest.json \
            --repo "$REPO" \
            --prerelease \
            --title "Desktop — update manifest" \
            --notes "Machine-readable. The desktop app reads \`latest.json\` from here to find out whether a newer release exists. Humans want the release list instead."
