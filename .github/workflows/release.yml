name: Release

# The bundles are built here and published **into the public repo**
# (unalcakir28/spacetrace), because a private repository's release assets need
# a credential to download and a download page must not ask for one. Source
# stays private; the installers are public. See RELEASING.md.
#
#   push to main   -> tag `desktop-continuous`, replaced in place
#   push of a v*   -> tag `desktop-v…`, permanent
#
# Nothing is code-signed. macOS and Windows will both warn on first launch and
# the download page says so and how to get past it; signing needs certificates
# that cost money and cannot live in a repo.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # CHANGELOG.md is named out of this list on purpose: it is not
    # documentation but the release notes themselves, and it is compiled into
    # the binary. A push that only touches it must still rebuild, or the
    # continuous release keeps describing the version before it.
    paths-ignore:
      - "README.md"
      - "RELEASING.md"
      - "tasks/**"
      - "design-preview.html"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build as, e.g. v0.1.0-test"
        required: true
      publish:
        description: >-
          Publish the result. Off by default, so a dispatch is a dry run.
          Turn it on to release a tag by hand — which is the way out if the
          paths-ignore filter above skipped a tag push.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Where the downloads live. One public place for all three components.
  DOWNLOAD_REPO: unalcakir28/spacetrace

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      rolling: ${{ steps.pick.outputs.rolling }}
      channel: ${{ steps.pick.outputs.channel }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: pick
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tagged=false
          if [ -n "${INPUT_TAG:-}" ]; then
            version="$INPUT_TAG"; rolling=false
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"; rolling=false; tagged=true
          else
            version=continuous; rolling=true
          fi

          if [ "$rolling" = true ]; then channel=continuous; else channel=release; fi

          # This app carries its version in three files and RELEASING.md asks
          # for all three to be edited by hand. Nothing checked that they
          # agreed, so a half-done bump shipped an installer named v0.2.0
          # around a binary whose About panel said 0.1.0.
          pkg=$(jq -r .version package.json)
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          crate=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed 's/^version = "\(.*\)"/\1/')
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$crate" ]; then
            echo "::error::versions disagree — package.json $pkg, tauri.conf.json $conf, Cargo.toml $crate"
            exit 1
          fi

          # Real tag pushes only: a dispatch often names v0.1.0-test on
          # purpose, which is supposed to disagree.
          if [ "$tagged" = true ] && [ "$version" != "v$pkg" ]; then
            echo "::error::tag $version does not match version $pkg"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rolling=$rolling" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-$version" >> "$GITHUB_OUTPUT"
          echo "Building as desktop-$version" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.label }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal .dmg rather than two: the download page then has a
          # single macOS button, and "which Mac do I have" stops being the
          # user's problem.
          - label: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # `app` as well as `dmg`: the dmg is how someone installs the first
            # time, the `.app.tar.gz` beside it is what the updater downloads.
            # `bundle.targets` in tauri.conf.json lists both, but `--bundles`
            # on the command line overrides that file rather than adding to it
            # — which is why v0.3.0 shipped signed Windows and Linux updater
            # packages and no macOS one, and so no manifest at all.
            bundles: app,dmg
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
          # 24.04 for the glibc floor; deb, rpm and AppImage all come off this
          # one build.
          - label: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v5

      - name: System prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev build-essential file rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - run: yarn install --frozen-lockfile

      # Give the macOS app a stable code identity.
      #
      # This is **not** about Gatekeeper — a self-signed certificate buys
      # nothing there, and the download page still says the app is unsigned.
      # It is about TCC. macOS keys Full Disk Access and every folder
      # permission to an app's *designated requirement*; an ad-hoc signature
      # has none, so the system falls back to the binary's cdhash. Every
      # release is then a different app to macOS: the permission the user
      # granted shows as "on" in System Settings and is silently not honoured,
      # and the prompts return on every single update. Reported by a user on
      # 10 Sept 2026, with the toggle visibly on.
      #
      # Measured before building this: two bundles with different content,
      # signed with this certificate, share one requirement —
      #   identifier "com.spacetrace.desktop" and certificate leaf = H"940f90…"
      # while their cdhashes differ. That shared requirement is what survives
      # an update.
      #
      # The certificate must be *trusted* on the builder, not merely present:
      # Tauri resolves the identity with `security find-identity -v`, which
      # lists valid identities only, and a self-signed certificate is not
      # valid until it is a trusted root. Runners are ephemeral, so trusting
      # it there costs nothing and reaches no other machine.
      # The keychain is set up here rather than left to Tauri's own
      # `APPLE_CERTIFICATE` handling. Tauri does import the certificate
      # correctly, but then resolves the identity with
      # `security find-identity -v` inside a keychain it does not show you,
      # and a self-signed certificate is invisible to `-v` until it is a
      # trusted root — which produced "failed to resolve signing identity"
      # with no way to see what the runner actually had. Doing it in the open
      # costs a dozen lines and prints the identity list when it goes wrong.
      - name: Set up the signing keychain
        id: keychain
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning title=App identity is not stable::APPLE_CERTIFICATE is unset, so this build is ad-hoc signed. It installs and runs, but macOS will forget its Full Disk Access grant and re-ask for every folder on the next update. RELEASING.md has the one command that fixes it."
            exit 0
          fi

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$tmp/cert.p12"
          # -legacy: OpenSSL 3 writes a SHA-256 MAC by default and macOS
          # cannot read it — `security import` fails with "MAC verification
          # failed (wrong password?)", which sends you looking at the password
          # instead of the format. Seen on OpenSSL 3.6.2.
          openssl pkcs12 -legacy -in "$tmp/cert.p12" \
            -passin env:APPLE_CERTIFICATE_PASSWORD -nokeys -clcerts -out "$tmp/cert.pem"

          keychain="$RUNNER_TEMP/spacetrace.keychain-db"
          pw=$(openssl rand -base64 24)
          security create-keychain -p "$pw" "$keychain"
          # The default keychain locks after five minutes of idleness, and a
          # Rust release build is longer than that.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pw" "$keychain"
          security import "$tmp/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign is prompted for permission to use the key —
          # and on a runner nobody is there to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          security default-keychain -s "$keychain"
          # Trusted, or `find-identity -v` will not list it and Tauri will not
          # find it. The runner is thrown away after this job.
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$tmp/cert.pem"

          echo "Identities visible to the build:"
          security find-identity -v -p codesigning
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build bundles
        # Stamped in so the About panel can say which build this is rather than
        # only which version — every continuous build shares one number, and
        # that line is what identifies a build in a bug report.
        env:
          SPACETRACE_GIT_SHA: ${{ github.sha }}
          SPACETRACE_CHANNEL: ${{ needs.meta.outputs.channel }}
          # Signs the updater packages. This is Tauri's own minisign key, not
          # an Apple or Microsoft certificate: it proves an update came from
          # this pipeline, and says nothing about whether the OS trusts the app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Set only when the keychain step actually prepared one, so Tauri
          # looks the identity up in the default search list. Deliberately no
          # APPLE_CERTIFICATE here: that would send Tauri off to build a
          # second keychain of its own.
          #
          # An identity with nothing behind it is worse than no identity —
          # Tauri would try to sign, fail to resolve it, and take the build
          # down. Empty means the secret is absent, and the build then has to
          # look exactly like the ad-hoc ones that came before.
          APPLE_SIGNING_IDENTITY: ${{ steps.keychain.outputs.ready == 'true' && 'spacetrace' || '' }}
        shell: bash
        run: |
          export SPACETRACE_BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            unset APPLE_SIGNING_IDENTITY
          fi

          # Without the secret, the updater has to be switched off for the
          # build — not merely left unsigned. Two things were measured here,
          # both the hard way:
          #
          #   * an unset secret expands to an empty string, and Tauri signs
          #     with it and dies: "Missing comment in secret key";
          #   * with `pubkey` still in the config and no private key at all,
          #     it dies anyway: "A public key has been found, but no private
          #     key".
          #
          # So the config is stripped instead. Installers still build and
          # publish; only self-update is absent, which is the honest state of
          # a pipeline that cannot sign. Setting the secret is one command and
          # RELEASING.md has it.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            jq 'del(.plugins.updater) | .bundle.createUpdaterArtifacts = false' \
              src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
            mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
            echo "::warning title=Updates are disabled in this build::TAURI_SIGNING_PRIVATE_KEY is unset, so the app cannot check for or install updates. Downloads are unaffected. RELEASING.md has the one command that fixes it."
          fi
          # The lockfile is verified separately rather than with `--locked` on
          # the build. yarn 1 drops every argument before a `--`, so
          # `yarn tauri build --target X -- --locked` reaches the CLI as
          # `tauri build --locked` with the target gone — seen failing in CI.
          #
          # `cargo fetch --locked` fails if Cargo.lock disagrees with the
          # manifests, and once it agrees a normal build cannot change it. Same
          # guarantee, no argument smuggling: the core crates are git
          # dependencies with no rev, so without this two builds of one tag can
          # ship different scanner code and the stamped commit becomes a
          # half-truth.
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          yarn tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Falling back to an ad-hoc signature produces a release that installs
      # and runs perfectly, and quietly brings the permission prompts back on
      # every update. That is exactly the kind of failure nobody notices, so
      # the identity is asserted rather than assumed.
      - name: Check the app identity is stable
        if: runner.os == 'macOS'
        env:
          READY: ${{ steps.keychain.outputs.ready }}
          # The certificate's own SHA-1 fingerprint. Public by nature — it is
          # printed in the requirement of every copy of the app. It changes
          # only if the certificate is replaced, and replacing it resets every
          # user's granted permissions, so treat a mismatch here as a question
          # about the certificate, not about this line.
          LEAF: 940f909c3575db203d45c0ae67eb57ee4467ced4
        run: |
          set -eu
          if [ "${READY:-}" != "true" ]; then
            echo "No certificate in this build; nothing to check." && exit 0
          fi
          app=$(ls -d "src-tauri/target/${{ matrix.target }}/release/bundle/macos/"*.app | head -1)
          got=$(codesign -d --requirements - "$app" 2>&1 | tail -1)
          echo "$got"
          # `root`, not `leaf`. codesign writes whichever the chain says, and
          # for a self-signed certificate that the builder trusts as a root it
          # writes `root`; the same certificate untrusted gives `leaf`. Both
          # are stable across builds, but they are *different strings*, and
          # TCC compares the requirement as written — so a build that quietly
          # stopped trusting the certificate would produce a valid signature
          # and still lose every granted permission. Pinned exactly for that
          # reason: this line is what makes the trust step non-optional.
          case "$got" in
            *"certificate root = H\"$LEAF\""*)
              echo "Stable identity confirmed; granted permissions will survive this update." ;;
            *)
              echo "::error title=App identity is not stable::The bundle is not signed with the spacetrace certificate, so macOS will treat this release as a different app and forget every permission the user granted."
              exit 1 ;;
          esac

      # Tauri signs the .dmg with the same identity as the app, and that turns
      # the download itself into something Gatekeeper refuses: a disk image
      # carrying a signature from a certificate macOS does not trust is
      # rejected at *mount* time, so the user never reaches the app inside. An
      # unsigned image mounts and leaves the question to the app, which is the
      # behaviour every release before v0.4.1 had. Measured on macOS 26.5.2:
      #
      #   v0.4.0  source=no usable signature  -> opens
      #   v0.4.1  origin=spacetrace           -> "Apple could not verify…"
      #
      # Signing the app is the whole point of the certificate (TCC keys its
      # grants to the app's identity), so the app keeps its signature and only
      # the container loses one. `codesign --remove-signature` refuses to touch
      # a disk image — "operation inapplicable or not supported for this type
      # of code" — so the image is rebuilt instead. Converting copies the
      # filesystem verbatim, so the signed .app, the Applications symlink and
      # the window layout all survive; zlib-level=9 is the level Tauri itself
      # uses, and leaving it at hdiutil's default of 1 would add ~900 KB.
      - name: Unsign the disk image
        if: runner.os == 'macOS' && steps.keychain.outputs.ready == 'true'
        shell: bash
        run: |
          set -eu
          shopt -s nullglob
          for dmg in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            tmp="${dmg%.dmg}-unsigned.dmg"
            hdiutil convert "$dmg" -format UDZO -imagekey zlib-level=9 -o "$tmp"
            mv "$tmp" "$dmg"

            if codesign -dv "$dmg" >/dev/null 2>&1; then
              echo "::error title=The disk image is still signed::A signed disk image is refused at mount time, so the download cannot be opened at all."
              exit 1
            fi

            # The container was rebuilt around the app; assert the app came
            # through it intact rather than assuming, because a corrupted
            # signature in here would look exactly like a working release
            # until someone downloaded it.
            mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | grep -o '/Volumes/.*' | tail -n 1)
            codesign --verify --deep --strict "$mnt"/*.app
            codesign -d --requirements - "$mnt"/*.app 2>&1 | tail -1
            hdiutil detach "$mnt" >/dev/null
            echo "Disk image is unsigned and the app inside still verifies."
          done

      - name: Collect
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          LABEL: ${{ matrix.label }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          shopt -s nullglob
          # NOT dist/: that is Vite's output directory (`frontendDist` is
          # ../dist), so staging here would upload index.html and assets/
          # alongside the installers.
          mkdir -p bundles
          found=0
          for f in src-tauri/target/"$TARGET"/release/bundle/*/*.dmg \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.exe \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.deb \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.rpm \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.AppImage; do
            ext="${f##*.}"
            # A stable name is the point: the download page links one URL per
            # platform and it must not move when the version does.
            if [ "$ext" = "exe" ]; then suffix="-setup"; else suffix=""; fi
            cp "$f" "bundles/spacetrace-desktop-${VERSION}-${LABEL}${suffix}.${ext}"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "no bundles were produced" >&2; exit 1; }

          # The updater's own packages, kept separate from the five names the
          # download page binds to. Adding files is safe; renaming those five
          # is not, and the consumer is in another repo.
          #
          # macOS updates from the `.app.tar.gz`, Windows from the NSIS
          # installer and Linux from the AppImage — each with the `.sig` beside
          # it. deb and rpm have no updater path on purpose: those belong to a
          # package manager, and an app that fights dpkg is a worse citizen
          # than one that leaves it alone.
          for f in src-tauri/target/"$TARGET"/release/bundle/*/*.app.tar.gz \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.app.tar.gz.sig \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.exe.sig \
                   src-tauri/target/"$TARGET"/release/bundle/*/*.AppImage.sig; do
            base="${f##*/}"
            case "$base" in
              *.app.tar.gz)     out="spacetrace-desktop-${VERSION}-${LABEL}.app.tar.gz" ;;
              *.app.tar.gz.sig) out="spacetrace-desktop-${VERSION}-${LABEL}.app.tar.gz.sig" ;;
              *.exe.sig)        out="spacetrace-desktop-${VERSION}-${LABEL}-setup.exe.sig" ;;
              *.AppImage.sig)   out="spacetrace-desktop-${VERSION}-${LABEL}.AppImage.sig" ;;
            esac
            cp "$f" "bundles/${out}"
          done
          ls -la bundles

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: bundles/*
          if-no-files-found: error

  publish:
    name: publish ${{ needs.meta.outputs.tag }}
    needs: [meta, build]
    # A dispatch is a dry run unless it was asked to publish.
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release notes are sliced out of CHANGELOG.md, so this job needs the
      # repository and not only the built bundles. It did not check out before
      # the notes came from a heredoc.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        # Regular files only, and never the sums file itself: `sha256sum ./*`
        # dies on the first directory it meets, which is how a stray folder in
        # an artifact takes the whole release down.
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + \
            | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Where do these go
        id: dest
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "${RELEASE_TOKEN:-}" ]; then
            echo "repo=$DOWNLOAD_REPO" >> "$GITHUB_OUTPUT"
          else
            echo "repo=$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
            echo "::warning title=Downloads are not public::RELEASE_TOKEN is unset, so the bundles were published into this private repository. Their URLs need a credential to fetch, which the download page cannot supply. RELEASING.md has the one command that fixes it."
          fi

      - name: Publish
        env:
          # The fine-grained token when it exists, so the release lands in the
          # public repo; the built-in one otherwise, which can only write here.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.dest.outputs.repo }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          ROLLING: ${{ needs.meta.outputs.rolling }}
        run: |
          # The changes come out of CHANGELOG.md rather than from the
          # generator in the core repo, which is not a command here. That is
          # also the correct source: CHANGELOG.md is produced from the *pinned*
          # version of that crate and a test asserts it is current, so slicing
          # it guarantees these notes match the changelog compiled into the app
          # being published.
          if [ "$ROLLING" = "true" ]; then
            section="Unreleased"
          else
            section="${VERSION#v} — "
          fi
          awk -v want="$section" '
            index($0, "## " want) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > changes.md

          # A release with no notes is worse than no release: the reader cannot
          # tell whether the notes are missing or the version was empty.
          if [ "$ROLLING" != "true" ] && [ ! -s changes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi

          cat > notes.md <<EOF
          spacetrace desktop, built from \`$GITHUB_REPOSITORY\` at \`${GITHUB_SHA:0:7}\` on $(date -u '+%Y-%m-%d %H:%M UTC').

          | Platform | File |
          |---|---|
          | macOS 11+ (Intel and Apple silicon) | \`.dmg\` |
          | Windows 10/11 | \`-setup.exe\` |
          | Debian / Ubuntu | \`.deb\` |
          | Fedora / RHEL | \`.rpm\` |
          | Any Linux | \`.AppImage\` |

          **Not code-signed.** macOS: double-click once, then *System Settings →
          Privacy & Security → Open Anyway* within the hour — the right-click
          *Open* shortcut was removed in macOS 15. If that button never appears,
          run \`xattr -dr com.apple.quarantine /Applications/spacetrace.app\`.
          Windows: *More info* then *Run anyway* on the SmartScreen prompt.

          Install notes and usage: https://spacetrace.teknobakkall.com/download/
          EOF

          if [ -s changes.md ]; then
            printf '\n## What changed\n' >> notes.md
            cat changes.md >> notes.md
          fi

          if [ "$ROLLING" = "true" ]; then
            # Deleted and recreated so a bundle dropped from the matrix cannot
            # linger on the download page as a stale link.
            gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes || true
            gh release create "$TAG" artifacts/* \
              --repo "$REPO" \
              --prerelease \
              --title "Desktop — continuous build (main)" \
              --notes-file notes.md
          else
            # --latest=false: the download repository holds all three
            # components, and `gh release create` otherwise makes whichever
            # published most recently GitHub's "latest". That endpoint belongs
            # to the CLI — `spacetrace update` and the agent in versions up to
            # v0.4.0 read it, and a desktop tag there parses as no version at
            # all, so those installs go quiet and stay quiet. Measured on
            # 9 Sept 2026, when hub-v0.3.0 took the slot.
            gh release create "$TAG" artifacts/* \
              --repo "$REPO" \
              --latest=false \
              --title "spacetrace desktop $VERSION" \
              --notes-file notes.md
          fi

      # ------------------------------------------------------------ updater
      #
      # The app polls one fixed URL, so the manifest needs a tag that never
      # moves while its contents do. `desktop-latest` holds exactly this one
      # file and is recreated on every stable release; the five installer names
      # the download page binds to are untouched.
      #
      # Stable only. Pointing the updater at `desktop-continuous` would offer
      # every push to everyone who installed a release.
      - name: Publish the update manifest
        if: needs.meta.outputs.rolling == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.dest.outputs.repo }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          cd artifacts
          base="https://github.com/${REPO}/releases/download/${TAG}"

          # Every platform needs its signature file. Missing ones mean the
          # signing secret is not set, and a manifest that names an unsigned
          # package is a manifest the app will refuse — better to say so and
          # leave the previous manifest in place than to publish a broken one.
          mac="spacetrace-desktop-${VERSION}-macos-universal.app.tar.gz"
          win="spacetrace-desktop-${VERSION}-windows-x86_64-setup.exe"
          lin="spacetrace-desktop-${VERSION}-linux-x86_64.AppImage"
          missing=0
          for f in "$mac.sig" "$win.sig" "$lin.sig"; do
            [ -f "$f" ] || { echo "::warning::no $f — updater manifest skipped"; missing=1; }
          done
          if [ "$missing" = 1 ]; then
            echo "Set the TAURI_SIGNING_PRIVATE_KEY secret to enable self-update." >&2
            exit 0
          fi

          # macOS ships one universal bundle, so both architectures point at it.
          jq -n \
            --arg version "${VERSION#v}" \
            --arg pub_date "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --arg mac_url "$base/$mac" --arg mac_sig "$(cat "$mac.sig")" \
            --arg win_url "$base/$win" --arg win_sig "$(cat "$win.sig")" \
            --arg lin_url "$base/$lin" --arg lin_sig "$(cat "$lin.sig")" \
            '{
               version: $version,
               pub_date: $pub_date,
               notes: "",
               platforms: {
                 "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                 "darwin-x86_64":  { signature: $mac_sig, url: $mac_url },
                 "windows-x86_64": { signature: $win_sig, url: $win_url },
                 "linux-x86_64":   { signature: $lin_sig, url: $lin_url }
               }
             }' > latest.json
          cat latest.json

          gh release delete desktop-latest --repo "$REPO" --cleanup-tag --yes || true
          gh release create desktop-latest latest.json \
            --repo "$REPO" \
            --prerelease \
            --title "Desktop — update manifest" \
            --notes "Machine-readable. The desktop app reads \`latest.json\` from here to find out whether a newer release exists. Humans want the release list instead."
