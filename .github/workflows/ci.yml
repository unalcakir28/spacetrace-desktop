name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux carries the lint pass because the Tauri build script needs
  # webkit2gtk's pkg-config files, and installing them is cheaper here than
  # anywhere else.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: System prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: yarn install --frozen-lockfile
      # Only `tauri build` checks this, and that runs in the release workflow —
      # so a mismatch used to pass CI and then fail the release on all three
      # platforms at once. Cheap here, expensive there.
      - run: yarn check:plugins
      - run: yarn typecheck

      # `tauri::generate_context!()` reads the bundle configuration at compile
      # time and refuses to expand when `frontendDist` does not exist, so the
      # frontend has to be built before anything touches the Rust crate — even
      # for a check that never links a binary. It is missing on a fresh
      # checkout because dist/ is generated and gitignored.
      - run: yarn build

      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # See the note in the lint job: the Rust crate does not compile without
      # the built frontend, tests included.
      - run: yarn install --frozen-lockfile
      - run: yarn build

      - name: Tests
        working-directory: src-tauri
        run: cargo test
